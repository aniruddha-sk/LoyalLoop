{% extends "base.html" %}

{% block title %}
Create Owner Account | LoyalLoop
{% endblock %}

{% block content %}

<div class="auth-page">

<div class="auth-card fade-up">

<div class="auth-logo">

<div class="logo-mark">
L
</div>

<h1>
LoyalLoop
</h1>

</div>


<div class="auth-heading">

<h2>
Create your business account
</h2>

<p>
Start building stronger customer relationships.
</p>

</div>


<form
method="POST"
action="{{ url_for('owner_register') }}"
>


<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
name="full_name"
placeholder="Enter your full name"
required
autocomplete="name"
>

</div>


<div class="form-group">

<label>
Email
</label>

<input
type="email"
name="email"
placeholder="you@example.com"
required
autocomplete="email"
>

</div>


<div class="form-group">

<label>
Mobile Number
</label>

<input
type="tel"
name="phone"
placeholder="Enter mobile number"
required
autocomplete="tel"
>

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
name="password"
placeholder="Create a strong password"
required
minlength="8"
autocomplete="new-password"
>

</div>


<button
type="submit"
class="auth-button"
>
Create Account
</button>


</form>


<div class="auth-footer">

<span>
Already have an account?
</span>

<a href="{{ url_for('owner_login') }}">
Login
</a>

</div>


</div>

</div>

{% endblock %}
