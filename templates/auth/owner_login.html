{% extends "base.html" %}

{% block title %}
Owner Login | LoyalLoop
{% endblock %}

{% block content %}

<div class="auth-page">

<div class="auth-card fade-up">

<div class="auth-logo">

<div class="logo-mark">
L
</div>

<h1>
LoyalLoop
</h1>

</div>


<div class="auth-heading">

<h2>
Welcome back
</h2>

<p>
Login to manage your business,
customers and loyalty program.
</p>

</div>


<form
method="POST"
action="{{ url_for('owner_login') }}"
>


<div class="form-group">

<label>
Email
</label>

<input
type="email"
name="email"
placeholder="you@example.com"
required
autocomplete="email"
>

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
name="password"
placeholder="Enter your password"
required
autocomplete="current-password"
>

</div>


<button
type="submit"
class="auth-button"
>
Login to Dashboard
</button>


</form>


<div class="auth-footer">

<span>
Don't have an account?
</span>

<a href="{{ url_for('owner_register') }}">
Create Account
</a>

</div>


</div>

</div>

{% endblock %}
